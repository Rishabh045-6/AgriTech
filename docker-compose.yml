# docker-compose.yml
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=agritech_prod
      - DB_USER=agritech_user
      - DB_PASSWORD=${DB_PASSWORD}
      - SENTINEL_CLIENT_ID_1=${SENTINEL_CLIENT_ID_1}
      - SENTINEL_CLIENT_SECRET_1=${SENTINEL_CLIENT_SECRET_1}
      - SENTINEL_CLIENT_ID_2=${SENTINEL_CLIENT_ID_2}
      - SENTINEL_CLIENT_SECRET_2=${SENTINEL_CLIENT_SECRET_2}
      - PORT=3001
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: agritech_prod
      POSTGRES_USER: agritech_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: